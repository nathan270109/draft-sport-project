    <div class="carousel-father">
        <div class="carousel-container">
            <button class="carousel-button prev" (click)="scrollLeft()" aria-label="Anterior">&#10094;</button>

            <div class="carousel-track" #carouselTrack>
                @for (product of carrosselService.products(); track $index) {
                <div class="product-card">
                    <img [src]="product.image" [alt]="product.name">
                    <h3>{{ product.name }}</h3>
                    <p>R$ {{ product.price }}</p>
                </div>
                }
            </div>

            <button class="carousel-button next" (click)="scrollRight()" aria-label="Próximo">&#10095;</button>
        </div>
    </div>
