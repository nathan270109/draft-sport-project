<h1>Seu carrinho</h1>

<button (click)="adicionarProdutoTeste()">
    Adicionar produto teste
</button>

<p>Produtos no carrinho: {{ cartService.produtos().length }}</p>

@for (produto of cartService.produtos(); track produto.id) {

<div>
    <h2>{{ produto.nome }}</h2>
    <p>{{ produto.descricao }}</p>
    <p>Tamanho: {{ produto.tamanho }}</p>
    <p>Quantidade: {{ produto.quantidade }}</p>
    <p>Preço: R$ {{ produto.preco }}</p>
</div>

}
